<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apenas o codigo</title>
<style>
#container-slide {
            width: 500px;
            height: 500px;
            overflow: hidden; 
            background-color: #1b1f8a; /* Fundo cinza só para você ver a caixa */
        }

        /* 2. Removemos o comportamento "inline" da imagem que causa bugs de espaçamento */
        #img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que a imagem preencha a caixa sem amassar */
        }
        
        /* Um pouco de estilo para os botões ficarem organizados */
        .botoes {
            margin-top: 20px;
        }

</style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
   var numero = 700 ;

$(document).ready(function(){
  $("#hide").click(function(){
    $("#img").hide(700 + numero);
  });
  $("#show").click(function(){
    $("#img").show(700 + numero);
  });
    $("#toggle").click(function(){
    $("#img").toggle(700 + numero);
  });
   $("#fadein").click(function(){
    $("#img").fadeIn(700 + numero);
  });
  $("#fadeout").click(function(){
    $("#img").fadeOut(700 + numero);
  });
    $("#fadetoggle").click(function(){
    $("#img").fadeToggle(700 + numero);
  });
     $("#slideup").click(function(){
    $("#img").slideUp(700 + numero);
  });
  $("#slidedown").click(function(){
    $("#img").slideDown(700 + numero);
  });
    $("#slidetoggle").click(function(){
    $("#img").slideToggle(700 + numero);
});
   $("#mais").click(function(){
      (numero += 100);
});   
   $("#menos").click(function(){
     (numero -= 100);
});

 });
</script>
</head>

<body>
   
   <div  style =" width: 500px ; height: 500px;">
    <img src="sol.png" alt="" id="img">
   </div>
   
   <div >
    <button id="hide">esconde</button>
      <button id="show">mostra</button>
      <button id="toggle">esconde e mostra</button>
       <button id="fadein">fadeIn</button>
      <button id="fadeout">fadeout</button>
    <button id="fadetoggle">fadetoggle</button>
    <button id="slideup">slideUp</button>
    <button id="slidedown">slidedonw</button>
    <button id="slidetoggle">slidetoggle</button>
    <button id="mais"> +</button>
    <button id="menos">-</button>
    </div>
  
</body>
</html>
