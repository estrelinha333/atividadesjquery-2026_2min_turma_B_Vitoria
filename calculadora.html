<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>

let n1 = 6;
let n2 = 2;


$(document).ready(function(){
  $("#b1").click(function(){
    let soma = n1 + n2 ;
    $("div").html("resultado da soma é "  + soma + ".");
  });

  $("#b2").click(function(){
    let multiplicacao = n1 * n2 ;
    $("div").html("resultado da multiplicação é " + multiplicacao + "." );
  });

  $("#b3").click(function(){
    let subtracao = n1 - n2
    $("div").html("resultado da subtração é " + subtracao + ".");
  });

  $("#b4").click(function(){
    let divisao = n1 / n2 
    $("div").html("resultado da divisão é " + divisao + "." );
  });
});
</script>
</head>
<body>
<button id="b1">somar</button>
<button id="b2">multiplicar</button>
<button id="b3">subtrair</button>
<button id="b4">dividir</button>
<div></div>

</body>
</html>
